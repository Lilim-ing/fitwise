[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitwise"
version = "0.1.0"
description = "Bra sizing and product-knowledge assistant: deterministic fit math, cited retrieval, refusal by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
fitwise = "fitwise.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitwise = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
